<svg width="64" height="64" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Deep Tech Badge Gradient -->
    <linearGradient id="sectile-badge-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Primary Stream Gradient (Indigo -> Violet -> Cyan) -->
    <linearGradient id="sectile-stream-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Secondary Stream Gradient -->
    <linearGradient id="sectile-stream-secondary" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Node Glow Gradient -->
    <linearGradient id="sectile-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5b4fc" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Compatibility aliases -->
    <linearGradient id="taskflow-badge-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="taskflow-stream-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="taskflow-stream-secondary" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="taskflow-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5b4fc" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
  </defs>

  <!-- Badge Container -->
  <rect width="36" height="36" rx="9" fill="url(#sectile-badge-grad)" />
  <rect x="0.5" y="0.5" width="35" height="35" rx="8.5" stroke="#6366f1" stroke-opacity="0.4" stroke-width="1" />

  <!-- Dynamic Flow Streams -->
  <path d="M8.5 12C8.5 12 13 10 18 12C23 14 27.5 12 27.5 12" stroke="url(#sectile-stream-primary)" stroke-width="2.5" stroke-linecap="round" />
  <path d="M10 18C13 18 16 16.5 18 16.5C21 16.5 24 19.5 27 19.5" stroke="url(#sectile-stream-secondary)" stroke-width="2.2" stroke-linecap="round" />
  <path d="M12 24C15 24 18 25.5 21 25.5C23.5 25.5 26 24 26 24" stroke="url(#sectile-stream-primary)" stroke-width="2.5" stroke-linecap="round" />

  <!-- Flow Nodes -->
  <circle cx="8.5" cy="12" r="2" fill="url(#sectile-glow)" />
  <circle cx="18" cy="16.5" r="2.2" fill="#38bdf8" />
  <circle cx="27.5" cy="12" r="2" fill="#a855f7" />
  <circle cx="26" cy="24" r="2.2" fill="url(#sectile-glow)" />
  <circle cx="12" cy="24" r="1.8" fill="#818cf8" />
</svg>
