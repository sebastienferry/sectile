# GitLab CI for the GitLab mirror of github.com/sebastienferry/sectile.
#
# The repository is developed on GitHub and pull-mirrored into GitLab, so the
# pipeline knows nothing of pull requests: every mirrored branch and tag gets a
# pipeline of its own (see `workflow` below), and what it produces is named
# after the pipeline and the ref. The GitLab merge requests that do exist on the
# mirror only spawn test environments (see the preview tag below).
#
# What a green pipeline produces depends on what it was run for:
#   - the server image, on every ref. Built by kaniko from ./Dockerfile and
#     pushed to this project's container registry as
#     <registry>/server:<iid>-<ref-slug> (plus <tag> on a tag and `latest` on
#     the default branch). argocd-sp deploys it (apps/sectile). A branch other
#     than the default one also gets server:preview-<commit sha>: argocd-sp's
#     testenv feature deploys that tag for every merge request labelled
#     `testenv` on the mirror, one ephemeral board per merge request, at the
#     head commit of its source branch. The image carries the interface, so
#     the web UX is built on a merge into main and on every tag, which is what
#     keeps dev and the testenvs current.
#   - the workstation binaries, on a tag and on nothing else. Cross-compiled
#     for every supported OS/arch and uploaded to this project's Generic
#     Package Registry under the package `sectile`, version <tag>.
#     `sectile-agent-*` is the local app; `sectile-server-*` is the same server
#     as the image, for bare-metal installs.
#
#     They are tag-only because a binary that somebody installs is a release:
#     an artefact named after a pipeline number is one nobody can report a bug
#     against, and every branch publishing one turned the package registry into
#     a list of builds rather than a list of versions. See
#     docs/adrs/0018-semver-tags-and-changelog.md, and AGENTS.md for how a tag
#     is cut.
#
# Both are gated on the Go, web and desktop test suites.
#
# On the default branch a third thing happens: the pipeline promotes the image
# it just published to dev, by rewriting the pinned tag in argocd-sp and
# merging that change (see promote:dev). ArgoCD deploys from the commit; this
# pipeline never talks to a cluster.

include:
  # Shared Go jobs (.go-test, runner tags, module cache); pulls in the kaniko
  # .docker-build job as well.
  - project: 'smartadserver/templates/jobs/go'
    ref: v5.0.0
    file: '/go.yml'

  # The shared automerge job, which is what moves the pinned tag in argocd-sp.
  # Pinned to an exact ref on purpose: a floating `ref` would let another
  # team's release change what this pipeline does to our cluster.
  - project: 'smartadserver/templates/jobs/argocd'
    ref: 6.0.1
    file: '/automerge.yml'

workflow:
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH

stages:
  - test
  - build
  - publish
  - promote

variables:
  NODE_IMAGE: "node:22"
  # The golang images pin GOTOOLCHAIN=local, and go.mod may require a newer
  # patch than the image ships (1.26.6 against 1.26.4 today). `auto` lets Go
  # fetch the toolchain go.mod asks for instead of failing on the version.
  GOTOOLCHAIN: "auto"
  # Go objects are content-addressed, so this cache is safe to share across
  # branches: a stale entry is skipped, never served. The template only caches
  # the module download directory.
  GOCACHE: "${CI_PROJECT_DIR}/.go-build-cache"
  # `npm ci` wipes node_modules before installing; caching npm's own store is
  # what saves the download.
  npm_config_cache: "${CI_PROJECT_DIR}/.npm-cache"
  # Skip the Electron binary download: the desktop unit tests are plain Node.
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
  # One version string for the image tag and the package version. On a tag the
  # jobs below override it with the tag itself, which is also what the binaries
  # are stamped with: what a user reports as their version has to be something
  # this repository can check out.
  SECTILE_VERSION: "${CI_PIPELINE_IID}-${CI_COMMIT_REF_SLUG}"
  SERVER_IMAGE: "${CI_REGISTRY_IMAGE}/server"

# ── Caches ────────────────────────────────────────────────────────────────────
# A job that declares `cache:` replaces the template's, so GOMODCACHE is
# repeated here rather than lost.
.go-cache:
  cache:
    - key:
        files:
          - go.sum
      paths:
        - ${GOMODCACHE}
    - key: "go-build-${CI_JOB_NAME}"
      paths:
        - ${GOCACHE}

.web-cache:
  cache:
    key:
      files:
        - web/package-lock.json
    paths:
      - ${npm_config_cache}

.desktop-cache:
  cache:
    key:
      files:
        - desktop/package-lock.json
    paths:
      - ${npm_config_cache}

# ── Tests ─────────────────────────────────────────────────────────────────────
# `needs: []` on every test job: they run in parallel, and only the publish jobs
# wait for them.

test:go:
  stage: test
  extends: [.go-test, .go-cache]
  needs: []
  # Blocking, like every other test job. It was allow_failure while main
  # carried six failures. Four were about this runner and reproduced on no
  # workstation: the suite runs as root, where a directory chmodded 0500 is
  # still writable; the image has no `claude` on PATH; a container's loopback
  # resets a socket sooner than a laptop's; and the runner's git records
  # origin/HEAD for a single-branch clone where Apple git does not. The fifth
  # was a data race in a test fixture, and the sixth the accented view label,
  # a real bug fixed in #424. All six are fixed, so the suite gates the image
  # again rather than reporting into a junit nobody reads.
  variables:
    # The race detector needs cgo; the build jobs keep CGO_ENABLED=0.
    CGO_ENABLED: "1"
  # -timeout is per package binary. Under -race with coverage, internal/db takes
  # about 490s of go test's default 600s on a healthy runner, and a slower K8S
  # pod pushed it past the limit (job 16736343583) with no test hung.
  script:
    - go install gotest.tools/gotestsum@v1.13.0
    - $GOPATH/bin/gotestsum --junitfile ${TEST_RESULT_PATH_XML} --jsonfile ${TEST_RESULT_PATH} --format testname -- -race -timeout 30m -covermode=atomic -coverprofile="${COVERAGE_RESULT_PATH}" ${GOLANG_TEST_PATH}

test:postgres:
  stage: test
  extends: [.go-test, .go-cache]
  needs: []
  # Deliberately not allow_failure: the whole point of this job is to gate. The
  # moment it is allowed to fail it stops being evidence that PostgreSQL still
  # works.
  services:
    - name: postgres:16
      alias: postgres
  variables:
    POSTGRES_DB: sectile_test
    POSTGRES_USER: sectile
    POSTGRES_PASSWORD: sectile
    # trust keeps the service simple; it is reachable only from this job.
    POSTGRES_HOST_AUTH_METHOD: trust
    SECTILE_TEST_POSTGRES_DSN: "postgres://sectile@postgres:5432/sectile_test?sslmode=disable"
    # Without it the smoke tests skip and the job passes having proved nothing.
    CGO_ENABLED: "0"
  script:
    # The subset is chosen for what breaks silently rather than for what is easy
    # to test: schema creation from empty, a CRUD round trip, an upsert, the
    # timestamp round trip that #294 was about, and a migration round trip.
    # The handlers subset is two instances sharing one database (#408), and
    # cmd/server's is the multi-replica harness: two real server processes on
    # that database, one of them killed, one drained (#410). The packages empty
    # the same database, hence -p 1.
    - go test -p 1 ./internal/db/ ./internal/handlers/ ./cmd/server/ -run 'TestPostgres|TestMigrate' -v

# The server-side half of `make fmt-check`, which until now only ran for whoever
# ran `make test` before pushing. It gates like test:postgres: the repository is
# gofmt-clean, so a red run means a commit broke it. It stays out of the
# publish jobs' needs; failing the pipeline is what blocks the merge.
lint:gofmt:
  stage: test
  needs: []
  # `gofmt -l .` walks every directory under the checkout, dot-directories
  # included. The template restores the module cache into
  # ${CI_PROJECT_DIR}/.go-mod-cache, and that cache holds the dependencies and
  # the whole Go toolchain source tree test:go downloads, whose testdata is
  # unformatted on purpose. So no cache is restored, and the toolchain fetched
  # below goes to the image's module directory, outside the checkout. gofmt
  # needs no module anyway.
  cache: []
  variables:
    GOMODCACHE: "/go/pkg/mod"
  script:
    # GOTOOLCHAIN=auto switches the go command to the version go.mod asks for,
    # but not the gofmt binary: the one on PATH is the image's. Putting the
    # selected toolchain first makes CI format with the go.mod version.
    - export PATH="$(go env GOROOT)/bin:${PATH}"
    - go version && command -v gofmt
    - make fmt-check

test:web:
  stage: test
  image: ${NODE_IMAGE}
  extends: .web-cache
  needs: []
  script:
    - cd web
    - npm ci --prefer-offline --no-audit --no-fund
    - npm test
    - npx tsc --noEmit -p tsconfig.app.json
    - npx oxlint src

test:desktop:
  stage: test
  image: ${NODE_IMAGE}
  extends: .desktop-cache
  needs: []
  script:
    - cd desktop
    - npm ci --prefer-offline --no-audit --no-fund
    - npm test

# ── Build ─────────────────────────────────────────────────────────────────────

# The interface, built once and handed to the cross-compile job as an artifact:
# go:embed takes it from internal/webui/dist, and the golang image has no Node.
build:web:
  stage: build
  image: ${NODE_IMAGE}
  extends: .web-cache
  needs: []
  # Only the cross-compiled binaries consume this artifact, and those are cut
  # from tags. The image builds the interface inside kaniko from the same
  # sources, so a merge into main still proves the UX compiles.
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - cd web
    - npm ci --prefer-offline --no-audit --no-fund
    - npm run build
    - test -f ../internal/webui/dist/index.html
  artifacts:
    paths:
      - internal/webui/dist/
    expire_in: 1 day

# Same targets and flags as `make release`; the file names carry the product
# name so they can be installed as-is under the canonical command names. The
# loop lives in scripts/release/build-binaries.sh, which the GitHub release
# workflow runs as well, so the two streams build the same set.
build:binaries:
  stage: build
  extends: .go-cache
  needs:
    - job: build:web
      artifacts: true
  rules:
    - if: $CI_COMMIT_TAG
  variables:
    CGO_ENABLED: "0"
  script:
    # The tag is what every binary reports for --version and on /api/version.
    # It is read from CI_COMMIT_TAG rather than derived, so the string a user
    # quotes in a bug report is a ref this repository can check out.
    - sh scripts/release/build-binaries.sh "${CI_COMMIT_TAG}" "${CI_COMMIT_SHA}" dist
    # The build stamped a version; a binary that does not report it is a broken
    # release, and finding that out after publication is finding it out too late.
    # Only the runner's own OS/arch can be executed here, and both Linux
    # architectures the loop produces are covered by whichever it turns out to be.
    - HOST_ARCH=$(go env GOARCH)
    - ./dist/sectile-server-linux-${HOST_ARCH} --version | grep -F "${CI_COMMIT_TAG}"
    - ./dist/sectile-agent-linux-${HOST_ARCH} --version | grep -F "${CI_COMMIT_TAG}"
    - cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
  artifacts:
    paths:
      - dist/
    expire_in: 1 week

# ── Publish ───────────────────────────────────────────────────────────────────

publish:image:
  stage: publish
  extends: .docker-build
  needs:
    - job: test:go
      artifacts: false
    - job: test:web
      artifacts: false
    - job: test:desktop
      artifacts: false
  variables:
    DOCKER_CONTEXT_PATH: "."
    DOCKER_DOCKERFILE_PATH: "Dockerfile"
    DOCKER_IMAGE_NAME: "${SERVER_IMAGE}:${SECTILE_VERSION}"
    # What the server inside the image reports on /api/version and in its
    # startup log. The Dockerfile declares these as ARGs and defaults them to
    # "dev", so an image built without them is honest rather than wrong; the
    # published binaries are stamped by build:binaries and never depend on this.
    DOCKER_BUILD_ARGS: "--build-arg SECTILE_VERSION=${SECTILE_VERSION} --build-arg SECTILE_COMMIT=${CI_COMMIT_SHA}"
  rules:
    - if: $CI_COMMIT_TAG
      variables:
        SECTILE_VERSION: "${CI_COMMIT_TAG}"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      variables:
        DOCKER_IMAGE_EXTRA_NAMES: "${SERVER_IMAGE}:latest"
    # The tag the argocd-sp test environments pull: the pullRequest generator
    # knows the merge request's head sha, not the pipeline iid.
    - if: $CI_COMMIT_BRANCH
      variables:
        DOCKER_IMAGE_EXTRA_NAMES: "${SERVER_IMAGE}:preview-${CI_COMMIT_SHA}"

publish:binaries:
  stage: publish
  image: curlimages/curl:8.14.1
  needs:
    - job: test:go
      artifacts: false
    - job: test:web
      artifacts: false
    - job: test:desktop
      artifacts: false
    - job: build:binaries
      artifacts: true
  script:
    - PACKAGE_URL="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/sectile/${SECTILE_VERSION}"
    - echo "Uploading to ${PACKAGE_URL}"
    - |
      for file in dist/*; do
        name=$(basename "$file")
        curl --fail --silent --show-error --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file "$file" "${PACKAGE_URL}/${name}" > /dev/null
        echo "  ${name}"
      done
  # Tags only, like the build it uploads. The package version is the tag, so
  # the registry lists releases rather than pipelines.
  rules:
    - if: $CI_COMMIT_TAG
      variables:
        SECTILE_VERSION: "${CI_COMMIT_TAG}"

# ── Promote ───────────────────────────────────────────────────────────────────

# A merge into main promotes itself to dev. The job rewrites the pinned image
# tag in argocd-sp (`apps/sectile/dev/values.yml`) and merges that change;
# ArgoCD reads the commit and deploys. Nothing is derived or retyped: what it
# pins is ${SECTILE_VERSION}, the exact string publish:image built the image
# with.
#
# Why this exists: the tag used to be copied by hand into argocd-sp, which does
# not fail loudly, it drifts: dev quietly runs something older than main while
# nobody is looking. See docs/adrs/0016-promotion-automatique-en-dev.md.
#
# Dev only. There is no production deployment of sectile to promote, and adding
# one is a decision rather than a follow-up.
promote:dev:
  stage: promote
  extends: .automerge
  needs:
    - job: publish:image
      artifacts: false
  # The Go template's `default:` caches the module directory. The automerge
  # image has no repository to set up and no modules to restore, so the cache
  # would only be paid for, never used.
  cache: []
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  variables:
    ARGOCD_REPO_URL: "https://gitlab.com/smartadserver/private/shared-platform/argocd-sp.git"
    PATH_TO_FILE: "apps/sectile/dev/values.yml"
    # The meta-chart holds the tag under the feature rather than at the root,
    # so the template's default `.image.tag` would find nothing to rewrite.
    YQ_QUERY: ".features.main.image.tag"
    TARGET_IMAGE_TAG: "${SECTILE_VERSION}"
